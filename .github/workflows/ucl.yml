name: Résultats Ligue des champions

on:
  schedule:
    # Mardi et mercredi à 22h30 UTC (23h30 à Paris en hiver, 0h30 en été)
    - cron: "30 22 * * 2,3"
  workflow_dispatch:
    inputs:
      date:
        description: "Date des matchs (AAAA-MM-JJ). Vide = aujourd'hui."
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: ucl-resultats
  cancel-in-progress: false

jobs:
  resultats:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Lancer le robot
        env:
          INPUT_DATE: ${{ github.event.inputs.date }}
        run: |
          if [ -n "$INPUT_DATE" ]; then
            DATE="$INPUT_DATE"
          else
            # Date UTC du jour : à 22h30 UTC c'est toujours la soirée de matchs,
            # même en été où il est déjà 0h30 le lendemain à Paris.
            DATE="$(date -u +%Y-%m-%d)"
          fi
          echo "Date demandée : $DATE"
          python3 ucl_bot.py --date "$DATE" --out resultats/

      - name: Commiter le rapport
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add resultats/
          if git diff --cached --quiet; then
            echo "Aucun changement à commiter."
          else
            git commit -m "Résultats Ligue des champions ($(ls -t resultats/*.md | head -1 | xargs basename .md))"
            git push
          fi
